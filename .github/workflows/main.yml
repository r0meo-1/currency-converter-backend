name: Currency converter workflow

on:
  push:
  pull_request:

jobs:
  tests:
    # Match the Python 3.9 application image on a supported runner.
    runs-on: ubuntu-22.04
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install -r currency_converter/requirements/requirements.lint.txt
        pip install -r currency_converter/requirements/requirements.test.txt
    - name: Test with flake8
      run: |
        python -m flake8 currency_converter/
    - name: Test conversion input validation
      working-directory: currency_converter
      run: python -m django test tests --settings=tests.settings

  build_backend_and_push_to_docker_hub:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: tests
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check optional DockerHub publishing credentials
        id: registry
        shell: bash
        run: |
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Login to Docker
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image and publish only when configured
        uses: docker/build-push-action@v7
        with:
          context: ./currency_converter/
          push: ${{ steps.registry.outputs.publish == 'true' }}
          tags: ${{ secrets.DOCKER_USERNAME || github.repository_owner }}/currency_converter_backend:latest
  
  build_gateway_and_push_to_docker_hub:
    name: Build gateway Docker image
    runs-on: ubuntu-latest
    needs: tests
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check optional DockerHub publishing credentials
        id: registry
        shell: bash
        run: |
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Login to Docker
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image and publish only when configured
        uses: docker/build-push-action@v7
        with:
          context: ./gateway/
          push: ${{ steps.registry.outputs.publish == 'true' }}
          tags: ${{ secrets.DOCKER_USERNAME || github.repository_owner }}/currency_converter_gateway:latest
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    # VPS temporarily off: keep tests and image builds running.
    if: false # Resume the original main-branch condition when VPS is available.
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Copy docker-compose.yml via ssh
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "docker-compose.production.yml"
        target: "converter"
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script_stop: true
        script: |
          cd converter
          sudo docker compose -f docker-compose.production.yml pull
          sudo docker compose -f docker-compose.production.yml down
          sudo docker compose -f docker-compose.production.yml up -d
          sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate
          sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic
          sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: Деплой Currency converter успешно выполнен!
